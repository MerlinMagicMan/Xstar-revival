plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.xstarrevival.sdkprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'io.xstarrevival.sdkprobe'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0-probe'

        def appKey = project.findProperty('AUTEL_APP_KEY') ?: System.getenv('AUTEL_APP_KEY') ?: ''
        buildConfigField 'String', 'AUTEL_APP_KEY', '"' + appKey.replace('"', '\\"') + '"'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libwhitename.so', 'lib/arm64-v8a/libAutelUtil.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':appCore')
    implementation project(':autelBridge')
    // Obtain this AAR from Autel's official SDK distribution/repository and place it in app/libs.
    // Do not commit proprietary SDK binaries to this repository.
    implementation(name: 'autel-sdk-release', ext: 'aar')

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
