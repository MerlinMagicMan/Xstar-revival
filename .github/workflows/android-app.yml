name: Android App

on:
  pull_request:
    paths:
      - 'software/android-app/**'
      - 'software/android-autel-bridge/**'
      - 'software/android-sdk-probe/**'
      - 'software/app-core/**'
      - '.github/workflows/android-app.yml'
  push:
    branches: [main]
    paths:
      - 'software/android-app/**'
      - 'software/android-autel-bridge/**'
      - 'software/android-sdk-probe/**'
      - 'software/app-core/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verify official SDK binding stays receive-only
        run: python3 software/android-autel-bridge/tools/verify_read_only_binding.py

      - name: Test app core and video fixture
        working-directory: software/android-app
        run: gradle :appCore:test :app:testDebugUnitTest --stacktrace

      - name: Compile debug app
        working-directory: software/android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: xstar-revival-debug
          path: software/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
