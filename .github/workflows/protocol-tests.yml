name: Protocol Core Tests

on:
  push:
    paths:
      - 'protocol/python/**'
      - '.github/workflows/protocol-tests.yml'
  pull_request:
    paths:
      - 'protocol/python/**'
      - '.github/workflows/protocol-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: protocol/python
        run: python -m pip install -e '.[test]'
      - name: Test
        working-directory: protocol/python
        run: pytest -q
